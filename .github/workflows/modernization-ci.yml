name: Modernization CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-unit:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v

  real-data-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: syntax-and-unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Korean mappings from real Global 3.6 data
        run: python -m tools.update_game_data --language ko --ref 3.6

      - name: Validate generated mapping counts and source metadata
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          minimums = {
              "characters.json": 20,
              "weapons.json": 50,
              "items.json": 100,
              "echoes.json": 50,
              "achievements.json": 100,
          }

          for filename, minimum in minimums.items():
              path = Path("data") / filename
              data = json.loads(path.read_text(encoding="utf-8"))
              count = len(data)
              print(f"{filename}: {count}")
              if count < minimum:
                  raise SystemExit(
                      f"{filename} generated only {count} entries; expected at least {minimum}"
                  )

          manifest = json.loads(
              (Path("data") / "mapping_manifest.json").read_text(encoding="utf-8")
          )
          source = manifest["source"]
          assert source["repository"] == "Arikatsu/WutheringWaves_Data"
          assert source["ref"] == "3.6"
          assert source["language"] == "ko"
          assert source["game_version"].startswith("3.6")
          print(json.dumps(source, ensure_ascii=False, indent=2))
          '@ | python -

      - name: Verify offline reuse does not regenerate mappings
        shell: pwsh
        run: |
          $before = (Get-FileHash data/mapping_manifest.json -Algorithm SHA256).Hash
          python -m tools.update_game_data --language ko --ref 3.6 --offline
          $after = (Get-FileHash data/mapping_manifest.json -Algorithm SHA256).Hash
          if ($before -ne $after) {
            throw "Offline reuse unexpectedly regenerated mapping_manifest.json"
          }
